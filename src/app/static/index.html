<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f2">
  <title>Vega · Vessel Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1e2928;
      --muted: #71807d;
      --line: #e3e8e4;
      --paper: #fff;
      --canvas: #f5f7f4;
      --green: #256b59;
      --green-dark: #174d40;
      --mint: #e7f1eb;
      --orange: #d9824b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--canvas); color: var(--ink); }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 284px minmax(0, 1fr); }
    aside { display: flex; flex-direction: column; padding: 25px 17px 18px; background: #fbfcfa; border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 24px; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; color: white; background: var(--green); font-size: 19px; }
    .brand strong { display: block; letter-spacing: -.03em; font-size: 15px; }
    .brand small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .new-chat { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; height: 44px; border: 1px solid #cbd9d1; border-radius: 12px; color: var(--green-dark); background: var(--mint); font-weight: 650; transition: .18s ease; }
    .new-chat:hover { background: #dcebe2; transform: translateY(-1px); }
    .section-label { margin: 27px 10px 10px; color: #899490; text-transform: uppercase; letter-spacing: .12em; font-size: 10px; font-weight: 700; }
    .conversation-list { display: flex; flex: 1; flex-direction: column; gap: 4px; overflow: auto; }
    .conversation { display: flex; align-items: center; gap: 9px; width: 100%; padding: 10px 11px; border: 0; border-radius: 10px; color: #52605d; background: transparent; text-align: left; font-size: 13px; }
    .conversation:hover, .conversation.active { color: var(--ink); background: #eef2ee; }
    .conversation span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conversation-icon { flex: 0 0 auto; color: #899792; font-size: 14px; }
    .side-footer { display: flex; align-items: center; gap: 9px; padding: 17px 10px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .online { width: 7px; height: 7px; border-radius: 50%; background: #55a57b; box-shadow: 0 0 0 3px #e4f1e8; }
    main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
    header { height: 65px; display: flex; align-items: center; justify-content: space-between; padding: 0 38px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.68); }
    .page-title { font-size: 13px; font-weight: 650; }
    .header-note { color: var(--muted); font-size: 11px; }
    .mobile-brand, .menu-button { display: none; }
    .chat-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    .chat-content { width: min(790px, calc(100% - 48px)); margin: 0 auto; padding: 48px 0 35px; }
    .welcome { max-width: 590px; margin: 8vh auto 36px; text-align: center; }
    .welcome-symbol { display: grid; place-items: center; width: 54px; height: 54px; margin: 0 auto 20px; border: 1px solid #d6e4dc; border-radius: 18px; color: var(--green); background: var(--mint); font-size: 25px; }
    .eyebrow { color: var(--green); text-transform: uppercase; letter-spacing: .15em; font-size: 10px; font-weight: 750; }
    h1 { margin: 11px 0 10px; font-size: clamp(26px, 4vw, 37px); line-height: 1.15; letter-spacing: -.045em; font-weight: 650; }
    .welcome p { max-width: 440px; margin: 0 auto; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .suggestions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-top: 27px; text-align: left; }
    .suggestion { min-height: 68px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; color: #43514e; background: #fff; text-align: left; font-size: 12px; line-height: 1.45; transition: .16s ease; }
    .suggestion:hover { border-color: #b4cec0; background: #fbfdfb; transform: translateY(-1px); }
    .suggestion small { display: block; margin-bottom: 5px; color: var(--green); font-size: 10px; font-weight: 700; }
    .message { display: flex; gap: 13px; margin: 0 0 25px; animation: appear .2s ease both; }
    @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .avatar { flex: 0 0 auto; display: grid; place-items: center; width: 29px; height: 29px; border-radius: 10px; color: var(--green); background: var(--mint); font-size: 14px; }
    .message.user .avatar { color: #fff; background: #52635d; font-size: 11px; }
    .message-body { min-width: 0; flex: 1; padding-top: 2px; }
    .message-name { margin-bottom: 6px; color: #62716d; font-size: 11px; font-weight: 700; }
    .message-text { color: #263331; font-size: 14px; line-height: 1.72; white-space: pre-wrap; overflow-wrap: anywhere; }
    .tool-chip { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; margin: 0 0 10px; padding: 7px 10px; border: 1px solid #e4e9e4; border-radius: 9px; color: #61706c; background: #fff; font-size: 11px; }
    .tool-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); }
    .tool-detail { color: #8a9591; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .error-note { margin-top: 10px; padding: 10px 12px; border: 1px solid #f0d2c7; border-radius: 9px; color: #9b4d35; background: #fff8f5; font-size: 12px; line-height: 1.5; }
    .typing { display: inline-flex; gap: 4px; padding: 9px 0; }
    .typing i { width: 5px; height: 5px; border-radius: 50%; background: #80908a; animation: pulse 1s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
    .composer-wrap { padding: 12px 24px 18px; background: linear-gradient(transparent, var(--canvas) 20%); }
    .composer { display: flex; align-items: flex-end; gap: 10px; width: min(790px, 100%); margin: 0 auto; padding: 11px 11px 11px 16px; border: 1px solid #dce3dd; border-radius: 16px; background: #fff; box-shadow: 0 5px 24px rgba(27,49,40,.055); transition: border-color .2s, box-shadow .2s; }
    .composer:focus-within { border-color: #9bbbab; box-shadow: 0 5px 25px rgba(37,107,89,.1); }
    textarea { flex: 1; resize: none; max-height: 170px; min-height: 26px; padding: 4px 0; border: 0; outline: none; color: var(--ink); background: transparent; font-size: 13px; line-height: 1.55; }
    textarea::placeholder { color: #9aa5a1; }
    .send { flex: 0 0 auto; display: grid; place-items: center; width: 35px; height: 35px; border: 0; border-radius: 11px; color: white; background: var(--green); font-size: 17px; transition: .15s ease; }
    .send:hover:not(:disabled) { background: var(--green-dark); transform: translateY(-1px); }
    .send:disabled { cursor: default; opacity: .45; }
    .hint { margin: 9px auto 0; color: #9aa39f; text-align: center; font-size: 10px; }
    .empty-list { padding: 12px 10px; color: #96a09c; font-size: 12px; }
    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      aside { position: fixed; z-index: 5; inset: 0 auto 0 0; width: 284px; transform: translateX(-102%); transition: transform .22s ease; box-shadow: 16px 0 40px rgba(20,35,28,.1); }
      body.sidebar-open aside { transform: translateX(0); }
      main { height: 100dvh; }
      header { height: 57px; padding: 0 17px; }
      .menu-button { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: #fff; }
      .mobile-brand { display: block; margin-left: 10px; font-size: 13px; font-weight: 700; }
      .header-left { display: flex; align-items: center; }
      .header-note { font-size: 10px; }
      .chat-content { width: calc(100% - 34px); padding-top: 29px; }
      .welcome { margin: 5vh auto 30px; }
      .suggestions { grid-template-columns: 1fr; }
      .suggestion { min-height: 56px; }
      .composer-wrap { padding: 8px 12px 12px; }
      .hint { font-size: 9px; }
    }
    @media (max-width: 390px) { .header-note { display: none; } .welcome p { font-size: 13px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar">
      <div class="brand"><div class="brand-mark">⌁</div><div><strong>Vega Assistant</strong><small>Maritime intelligence</small></div></div>
      <button class="new-chat" id="new-chat"><span>＋</span> Cuộc hội thoại mới</button>
      <div class="section-label">Gần đây</div>
      <nav class="conversation-list" id="conversation-list"><div class="empty-list">Đang tải hội thoại…</div></nav>
      <div class="side-footer"><span class="online"></span><span>Trợ lý dữ liệu hàng hải</span></div>
    </aside>
    <main>
      <header>
        <div class="header-left"><button class="menu-button" id="menu-button" aria-label="Mở danh sách hội thoại">☰</button><span class="mobile-brand">Vega Assistant</span><span class="page-title" id="page-title">Trợ lý hàng hải</span></div>
        <div class="header-note">Câu trả lời dựa trên dữ liệu và công cụ hiện có</div>
      </header>
      <div class="chat-scroll" id="chat-scroll"><div class="chat-content" id="chat-content"></div></div>
      <div class="composer-wrap">
        <form class="composer" id="chat-form">
          <textarea id="message-input" rows="1" maxlength="20000" placeholder="Hỏi về tàu, AIS, hành trình hoặc công ty…" aria-label="Tin nhắn"></textarea>
          <button class="send" id="send-button" type="submit" aria-label="Gửi tin nhắn" disabled>↑</button>
        </form>
        <div class="hint">Enter để gửi · Shift + Enter để xuống dòng</div>
      </div>
    </main>
  </div>
  <script>
    const list = document.querySelector('#conversation-list');
    const content = document.querySelector('#chat-content');
    const scroll = document.querySelector('#chat-scroll');
    const input = document.querySelector('#message-input');
    const sendButton = document.querySelector('#send-button');
    const form = document.querySelector('#chat-form');
    const pageTitle = document.querySelector('#page-title');
    let activeId = null;
    let sending = false;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }

    function showWelcome() {
      content.innerHTML = `<section class="welcome">
        <div class="welcome-symbol">⌁</div><div class="eyebrow">Vega · Vessel intelligence</div>
        <h1>Biển dữ liệu,<br>rõ từng hành trình.</h1>
        <p>Tra cứu thông tin tàu, vị trí AIS, hành trình và doanh nghiệp hàng hải bằng ngôn ngữ tự nhiên.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Tìm thông tin tàu KOTA GAYA"><small>TRA CỨU TÀU</small>Tìm thông tin tàu KOTA GAYA</button>
          <button class="suggestion" data-prompt="Vị trí AIS gần nhất của tàu KOTA GAYA ở đâu?"><small>VỊ TRÍ AIS</small>Vị trí AIS gần nhất của tàu ở đâu?</button>
          <button class="suggestion" data-prompt="Cho tôi xem hành trình của tàu KOTA GAYA trong tháng gần nhất"><small>HÀNH TRÌNH</small>Xem hành trình trong tháng gần nhất</button>
          <button class="suggestion" data-prompt="Công ty nào đang sở hữu hoặc quản lý tàu KOTA GAYA?"><small>DOANH NGHIỆP</small>Ai sở hữu hoặc quản lý con tàu?</button>
        </div>
      </section>`;
      content.querySelectorAll('[data-prompt]').forEach(button => button.addEventListener('click', () => {
        input.value = button.dataset.prompt;
        resizeInput();
        input.focus();
        updateSendButton();
      }));
    }

    function addMessage(role, text = '') {
      const row = document.createElement('article');
      row.className = `message ${role}`;
      row.innerHTML = `<div class="avatar">${role === 'user' ? 'B' : '⌁'}</div><div class="message-body"><div class="message-name">${role === 'user' ? 'Bạn' : 'Vega Assistant'}</div><div class="message-text"></div><div class="message-extra"></div></div>`;
      row.querySelector('.message-text').textContent = text;
      content.append(row);
      scrollToBottom();
      return row;
    }

    function scrollToBottom() { requestAnimationFrame(() => { scroll.scrollTop = scroll.scrollHeight; }); }

    function setBusy(value) {
      sending = value;
      input.disabled = value;
      sendButton.textContent = value ? '…' : '↑';
      updateSendButton();
    }

    function updateSendButton() { sendButton.disabled = sending || !input.value.trim(); }
    function resizeInput() { input.style.height = 'auto'; input.style.height = `${Math.min(input.scrollHeight, 170)}px`; }

    async function loadConversations() {
      try {
        const response = await fetch('/conversations?limit=100');
        if (!response.ok) throw new Error('Không tải được danh sách hội thoại.');
        const data = await response.json();
        list.replaceChildren();
        if (!data.conversations.length) {
          list.innerHTML = '<div class="empty-list">Chưa có hội thoại nào</div>';
          return;
        }
        data.conversations.forEach(conversation => {
          const button = document.createElement('button');
          button.className = `conversation${conversation.session_id === activeId ? ' active' : ''}`;
          button.innerHTML = `<span class="conversation-icon">◷</span><span>${escapeHtml(conversation.title || 'Cuộc hội thoại mới')}</span>`;
          button.addEventListener('click', () => openConversation(conversation.session_id));
          list.append(button);
        });
      } catch (error) {
        list.innerHTML = `<div class="empty-list">${escapeHtml(error.message)}</div>`;
      }
    }

    async function newConversation() {
      if (sending) return;
      activeId = null;
      pageTitle.textContent = 'Trợ lý hàng hải';
      showWelcome();
      await loadConversations();
      closeSidebar();
      input.focus();
    }

    async function openConversation(id) {
      if (sending) return;
      activeId = id;
      content.replaceChildren();
      pageTitle.textContent = 'Cuộc hội thoại';
      await loadConversations();
      closeSidebar();
      try {
        const response = await fetch(`/conversations/${id}/messages`);
        if (!response.ok) throw new Error('Không tải được nội dung hội thoại.');
        const data = await response.json();
        const messages = data.messages.filter(message => message.role === 'user' || message.role === 'assistant');
        if (!messages.length) showWelcome();
        for (const message of messages) addMessage(message.role === 'user' ? 'user' : 'assistant', message.content || '');
        scrollToBottom();
      } catch (error) {
        content.replaceChildren();
        const row = addMessage('assistant');
        showError(row, error.message);
      }
    }

    function showError(row, message) {
      const error = document.createElement('div');
      error.className = 'error-note';
      error.textContent = message;
      row.querySelector('.message-extra').append(error);
      scrollToBottom();
    }

    function addToolCall(row, data) {
      const chip = document.createElement('div');
      chip.className = 'tool-chip';
      const args = JSON.stringify(data.arguments || {});
      chip.innerHTML = `<span class="tool-dot"></span><strong>${escapeHtml(data.name || 'tool')}</strong><span class="tool-detail">${escapeHtml(args)}</span>`;
      row.querySelector('.message-extra').append(chip);
      scrollToBottom();
    }

    async function consumeSse(response, assistantRow) {
      if (!response.body) throw new Error('Trình duyệt không hỗ trợ đọc phản hồi stream.');
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let eventName = 'message';
      let dataLines = [];
      let completed = false;

      function dispatch() {
        if (!dataLines.length) { eventName = 'message'; return; }
        let data;
        try { data = JSON.parse(dataLines.join('\n')); }
        catch { data = { message: dataLines.join('\n') }; }
        if (eventName === 'token') {
          assistantRow.querySelector('.message-text').textContent += data.text || '';
          assistantRow.querySelector('.typing')?.remove();
          scrollToBottom();
        } else if (eventName === 'tool_call') {
          addToolCall(assistantRow, data);
        } else if (eventName === 'error') {
          showError(assistantRow, data.message || data.code || 'Đã xảy ra lỗi.');
        } else if (eventName === 'done') {
          completed = true;
        }
        eventName = 'message';
        dataLines = [];
      }

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');
        let boundary;
        while ((boundary = buffer.indexOf('\n\n')) >= 0) {
          const block = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          for (const line of block.split('\n')) {
            if (line.startsWith('event:')) eventName = line.slice(6).trim();
            else if (line.startsWith('data:')) dataLines.push(line.slice(5).trimStart());
          }
          dispatch();
        }
      }
      buffer += decoder.decode();
      if (buffer.trim()) {
        for (const line of buffer.split(/\r?\n/)) {
          if (line.startsWith('event:')) eventName = line.slice(6).trim();
          else if (line.startsWith('data:')) dataLines.push(line.slice(5).trimStart());
        }
        dispatch();
      }
      if (!completed && !assistantRow.querySelector('.error-note')) showError(assistantRow, 'Kết nối đã đóng trước khi nhận sự kiện hoàn tất.');
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message || sending) return;
      setBusy(true);
      content.querySelector('.welcome')?.remove();
      addMessage('user', message);
      const assistantRow = addMessage('assistant');
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.innerHTML = '<i></i><i></i><i></i>';
      assistantRow.querySelector('.message-text').append(typing);
      try {
        if (!activeId) {
          const created = await fetch('/conversations', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title: message.slice(0, 70)})
          });
          if (!created.ok) throw new Error('Không thể tạo hội thoại mới.');
          activeId = (await created.json()).session_id;
          pageTitle.textContent = 'Cuộc hội thoại';
          await loadConversations();
        }
        const response = await fetch(`/conversations/${activeId}/chat`, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message})
        });
        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          throw new Error(detail.detail || 'Không thể gửi tin nhắn đến máy chủ.');
        }
        await consumeSse(response, assistantRow);
        await loadConversations();
      } catch (error) {
        showError(assistantRow, error.message || 'Không thể kết nối đến máy chủ.');
      } finally {
        assistantRow.querySelector('.typing')?.remove();
        setBusy(false);
        input.focus();
      }
    }

    function closeSidebar() { document.body.classList.remove('sidebar-open'); }

    document.querySelector('#new-chat').addEventListener('click', newConversation);
    document.querySelector('#menu-button').addEventListener('click', () => document.body.classList.toggle('sidebar-open'));
    form.addEventListener('submit', event => {
      event.preventDefault();
      const message = input.value;
      input.value = '';
      resizeInput();
      updateSendButton();
      sendMessage(message);
    });
    input.addEventListener('input', () => { resizeInput(); updateSendButton(); });
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); }
    });
    document.addEventListener('click', event => {
      if (document.body.classList.contains('sidebar-open') && !event.target.closest('aside') && !event.target.closest('#menu-button')) closeSidebar();
    });

    showWelcome();
    loadConversations();
  </script>
</body>
</html>
